<!doctype html>

    <title>Email Development by Amanda</title>

  <body>
    <div id="executeart-panel" class="screenshots-panel">
      <div class="executeart-panel-title">
        <div class="responsive-view">Check responsive View</div>
        <i
          id="desktop_view"
          class="fa fa-desktop active"
          onclick="desktop_view(this)"
        ></i>
        <i
          id="tablet_view"
          class="fa fa-tablet"
          onclick="tablet_view(this)"
        ></i>
        <i
          id="mobile_view"
          class="fa fa-mobile"
          onclick="mobile_view(this)"
        ></i>
      </div>
      <div class="executeart-screenshots-panel-content">
        <div class="custom-scroll">
          <div class="screenshots-list-container all-email-tab-area">
            <ul class="screenshots-list">
              <li>
                <a
                  href="images/all-email-screenshot/Android Outlook.png"

                  Android 6 Outlook
